[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot-mcp"
version = "0.1.0"
description = "MCP server for weekly market analysis of TSLA, BRK-B, and BTC"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "alpaca-py>=0.30.0",
    "yfinance>=0.2.40",
    "requests>=2.31.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "pandas_market_calendars>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.5.0",
]

[project.scripts]
trading-bot-mcp = "mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["mcp_server*"]
